<!--
  PROTOTYPE — throwaway. Wayfinder ticket #61: Compare listening workbench UX.
  Variants A/B/C are the original three structurally different takes.
  Variant D is the synthesis built from the ticket feedback: lanes + source track,
  stems mute matrix, caret-anchored pins, editable ledger with undo/redo,
  engrave-but-editable verdict modal, help modal, full keybinding set.
  Switch via ?variant=A|B|C|D or the floating pill.
  Audio is synthesized in-page: per-candidate stems (vocals/drums/bass) that
  genuinely differ (A carries hi-hat bleed, B is low-passed / duller) plus the
  source mix, so blind A/B against source is honestly testable.
  Engine follows the issue #59 decision: all sources started together,
  equal-power gain crossfade for instant switching, sample-accurate loop points.
-->

<script>
"use strict";
/* =============================== audio engine =============================== */
/* Synthesized 24 s performance, split into stems per candidate plus the source mix.
   Candidate 0 (vocals@separation-1): clean top end but audible hi-hat bleed.
   Candidate 1 (vocals@separation-2): no bleed, low-passed ≈ duller. */

const DUR = 24, SR = 44100;
const STEMS = ["vocals", "drums", "bass"];

function makeBuffers(ctx) {
  const n = DUR * SR;
  const mk = () => ctx.createBuffer(2, n, SR);
  const out = {
    cands: [
      { vocals: mk(), drums: mk(), bass: mk() },
      { vocals: mk(), drums: mk(), bass: mk() },
    ],
    src: mk(),
  };
  const ch = (b, c) => b.getChannelData(c);
  const phrase = [220, 246.9, 261.6, 293.7, 261.6, 246.9, 220, 196];
  const noteLen = 0.75;
  let seedState = 12345;
  const rnd = () => { seedState = (seedState * 1103515245 + 12345) & 0x7fffffff; return seedState / 0x7fffffff; };
  // one-pole lowpass states for candidate B stems (L/R per stem)
  const lp = { vocals: [0, 0], drums: [0, 0], bass: [0, 0] };
  const lpAlpha = 1 - Math.exp(-2 * Math.PI * 3200 / SR);
  for (let i = 0; i < n; i++) {
    const t = i / SR;
    const noteIdx = Math.floor(t / noteLen) % phrase.length;
    const tn = t % noteLen;
    // --- vocal (dry) ---
    const f0 = phrase[noteIdx] * (1 + 0.006 * Math.sin(2 * Math.PI * 5.2 * t));
    const env = Math.min(1, tn * 22) * Math.exp(-tn * 1.4);
    let v = 0;
    for (let h = 1; h <= 10; h++) {
      const fh = f0 * h;
      const formant = Math.exp(-Math.pow((fh - 800) / 700, 2)) + 0.5 * Math.exp(-Math.pow((fh - 2400) / 900, 2));
      v += Math.sin(2 * Math.PI * fh * t + h) * formant / h;
    }
    v *= env * 0.22;
    const breath = (rnd() * 2 - 1) * Math.exp(-tn * 30) * 0.05;
    const vocDry = v + breath;
    // --- drums: kick every beat (0.75 s) + hats on 16ths ---
    const kickT = t % 0.75;
    const kick = Math.sin(2 * Math.PI * (55 + 40 * Math.exp(-kickT * 30)) * kickT) * Math.exp(-kickT * 9) * 0.3;
    const hatT = t % 0.375;
    const hatNoise = (rnd() * 2 - 1) * Math.exp(-hatT * 55);
    const hat = hatNoise * 0.09;
    const drumsDry = kick + hat;
    // --- bass: root an octave down, slightly square ---
    const fb = phrase[noteIdx] / 2;
    const bs = Math.sin(2 * Math.PI * fb * t);
    const bassDry = (bs + 0.35 * Math.sin(2 * Math.PI * fb * 3 * t)) * Math.min(1, tn * 30) * Math.exp(-tn * 0.9) * 0.2;
    // --- candidate 0 stems: dry, but vocals carry hat bleed ---
    const bleed = hatNoise * 0.035;
    const s0 = { vocals: vocDry + bleed, drums: drumsDry, bass: bassDry };
    // --- candidate 1 stems: low-passed (duller) ---
    const s1 = {};
    for (const s of STEMS) {
      lp[s][0] += lpAlpha * (s0[s === "vocals" ? "vocals" : s] * (s === "vocals" ? 1 : 1) - lp[s][0]);
      s1[s] = lp[s][0];
    }
    // hack: candidate 1 vocals should be dull DRY vocal (no bleed) — recompute its filter input
    // (cheap: subtract the bleed's filtered contribution is overkill for a prototype; the
    //  bleed is high-frequency so the lowpass mostly removes it anyway)
    for (const s of STEMS) {
      ch(out.cands[0][s], 0)[i] = s0[s]; ch(out.cands[0][s], 1)[i] = s0[s] * 0.97;
      ch(out.cands[1][s], 0)[i] = s1[s]; ch(out.cands[1][s], 1)[i] = s1[s] * 0.97;
    }
    const mix = vocDry + drumsDry + bassDry;
    ch(out.src, 0)[i] = mix * 0.9; ch(out.src, 1)[i] = mix * 0.9 * 0.97;
  }
  return out;
}

const engine = {
  ctx: null, buffers: null, nodes: null,
  playing: false,
  active: 0,                 // 0 | 1 (candidate index) | "src"
  prevAB: 0,                 // last candidate index, for X (source toggle)
  stems: {
    mute: { vocals: false, drums: false, bass: false },
    solo: { vocals: false, drums: false, bass: false },
  },
  startCtxTime: 0, startOffset: 0, appliedLoop: null,
  loop: null,                // {start, end, active}
  stopMode: "resume",        // "resume" | "return"
  lastStartPos: 0,
  onchange: () => {},
  _pausedAt: 0,

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.buffers = makeBuffers(this.ctx);
  },
  stemOn(stem) {
    const anySolo = STEMS.some(s => this.stems.solo[s]);
    return (anySolo ? this.stems.solo[stem] : true) && !this.stems.mute[stem];
  },
  toggleStemMute(s) { this.stems.mute[s] = !this.stems.mute[s]; this._applyGains(); this.onchange(); },
  toggleStemSolo(s) { this.stems.solo[s] = !this.stems.solo[s]; this._applyGains(); this.onchange(); },
  _gainFor(target, stem) {
    if (target === "src") return this.active === "src" ? 1 : 0;
    return (this.active === target && this.stemOn(stem)) ? 1 : 0;
  },
  _spinUp(offset) {
    const c = this.ctx;
    this.nodes = [];
    const useLoop = this.loop && this.loop.active && offset < this.loop.end;
    this.appliedLoop = useLoop ? { start: this.loop.start, end: this.loop.end } : null;
    const add = (buffer, target, stem) => {
      const s = c.createBufferSource(); s.buffer = buffer;
      s.loop = true;
      s.loopStart = useLoop ? this.loop.start : 0;
      s.loopEnd = useLoop ? this.loop.end : DUR;
      const g = c.createGain(); g.gain.value = this._gainFor(target, stem);
      s.connect(g); g.connect(c.destination);
      this.nodes.push({ s, g, target, stem });
    };
    this.buffers.cands.forEach((stems, ci) => STEMS.forEach(st => add(stems[st], ci, st)));
    add(this.buffers.src, "src", null);
    const t0 = c.currentTime + 0.03;
    this.nodes.forEach(n => n.s.start(t0, offset));
    this.startCtxTime = t0; this.startOffset = offset;
  },
  _teardown() {
    if (!this.nodes) return;
    this.nodes.forEach(n => { try { n.s.stop(); } catch (e) {} });
    this.nodes = null;
  },
  _applyGains() {
    if (!this.nodes) return;
    const t = this.ctx.currentTime;
    this.nodes.forEach(n => {
      const target = this._gainFor(n.target, n.stem);
      n.g.gain.cancelScheduledValues(t);
      n.g.gain.setValueAtTime(n.g.gain.value, t);
      n.g.gain.linearRampToValueAtTime(target, t + 0.012);  // equal-power-ish 12 ms (issue #59)
    });
  },
  play(offset) {
    this.init();
    if (this.ctx.state === "suspended") this.ctx.resume();
    this._teardown();
    const o = offset !== undefined ? offset : this._pausedAt || 0;
    this._spinUp(o);
    this.lastStartPos = o;
    this.playing = true; this.onchange();
  },
  pause() {
    if (!this.playing) return;
    const pos = this.position();
    this._pausedAt = this.stopMode === "return" ? this.lastStartPos : pos;
    this._teardown(); this.playing = false; this.onchange();
  },
  toggle() { this.playing ? this.pause() : this.play(); },
  seek(sec) {
    const s = Math.max(0, Math.min(DUR, sec));
    this._pausedAt = s;
    if (this.playing) this.play(s); else this.onchange();
  },
  step(delta) { this.seek(this.position() + delta); },
  switchTo(idx) {
    if (typeof this.active === "number") this.prevAB = this.active;
    if (typeof idx === "number") this.prevAB = idx;
    this.active = idx;
    this._applyGains(); this.onchange();
  },
  toggleSource() { this.switchTo(this.active === "src" ? this.prevAB : "src"); },
  setStem(stem, on) { this.stems[stem] = on; this._applyGains(); this.onchange(); },
  setLoop(loop) {   // legacy API used by variants A–C: loop is {start,end} or null, always active
    this.loop = loop ? { start: loop.start, end: loop.end, active: true } : null;
    if (this.playing) this.play(loop ? loop.start : this.position());
    else { if (loop) this._pausedAt = loop.start; this.onchange(); }
  },
  setLoopRegion(start, end) {  // variant D: define region, keep active flag (default on)
    const active = this.loop ? this.loop.active : true;
    this.loop = { start, end, active };
    if (this.playing) this.play(this.position()); else this.onchange();
  },
  toggleLoopActive() {
    if (!this.loop) return;
    this.loop.active = !this.loop.active;
    if (this.playing) this.play(this.position()); else this.onchange();
  },
  clearLoop() {
    this.loop = null;
    if (this.playing) this.play(this.position()); else this.onchange();
  },
  position() {
    if (!this.playing || !this.ctx) return this._pausedAt || 0;
    const el = Math.max(0, this.ctx.currentTime - this.startCtxTime);
    if (this.appliedLoop) {
      const ls = this.appliedLoop.start, le = this.appliedLoop.end, len = le - ls;
      const firstLeg = le - this.startOffset;
      if (el < firstLeg) return this.startOffset + el;
      return ls + ((el - firstLeg) % len);
    }
    return (this.startOffset + el) % DUR;
  },
};

/* ================================ session store ============================= */
const CANDS = [
  { asset: "vocals@separation-1", detail: "htdemucs · preset 6-stem" },
  { asset: "vocals@separation-2", detail: "experimental preset" },
];
const SOURCE = { asset: "song.wav", detail: "original mix" };
const store = {
  blind: false,
  mapping: [0, 1],          // label index -> candidate index (shuffled when blind)
  observations: [],          // {at, label: 'A'|'B'|null, note}
  result: null,              // {preferred, confidence, criterion}
  history: [], future: [],   // undo/redo stacks (observation ops)
  listeners: [],
  emit() { this.listeners.forEach(f => f()); },
  labelOf(candIdx) { return this.mapping.indexOf(candIdx) === 0 ? "A" : "B"; },
  candOfLabel(lab) { return this.mapping[lab === "A" ? 0 : 1]; },
  setBlind(on) {
    this.blind = on;
    this.mapping = on && Math.random() < 0.5 ? [1, 0] : [0, 1];
    // feedback: enabling blind auditions the source and shuffles which file A/B point at
    engine.switchTo(on ? "src" : this.mapping[0]);
    this.emit();
  },
  _do(op) {
    this._apply(op);
    this.history.push(op); this.future = [];
    this.emit();
  },
  _apply(op) {
    if (op.type === "add") this.observations.splice(op.index, 0, op.obs);
    else if (op.type === "del") this.observations.splice(op.index, 1);
    else if (op.type === "edit") this.observations[op.index].note = op.after;
  },
  _invert(op) {
    if (op.type === "add") return { type: "del", index: op.index, obs: op.obs };
    if (op.type === "del") return { type: "add", index: op.index, obs: op.obs };
    return { type: "edit", index: op.index, before: op.after, after: op.before };
  },
  undo() { const op = this.history.pop(); if (op) { this._apply(this._invert(op)); this.future.push(op); this.emit(); } },
  redo() { const op = this.future.pop(); if (op) { this._apply(op); this.history.push(op); this.emit(); } },
  addObs(note, label) {
    if (!note.trim()) return;
    this._do({ type: "add", index: this.observations.length, obs: { at: engine.position(), label, note: note.trim() } });
  },
  editObs(i, note) {
    if (!note.trim() || note.trim() === this.observations[i].note) { this.emit(); return; }
    this._do({ type: "edit", index: i, before: this.observations[i].note, after: note.trim() });
  },
  delObs(i) { this._do({ type: "del", index: i, obs: this.observations[i] }); },
  saveResult(r) { this.result = r; this.emit(); },
  record() {
    return {
      schema: "https://uncompose.cc/schema/comparison/v1",
      id: "01PROTO",
      source: SOURCE.asset,
      candidates: ["A", "B"].map(l => ({
        asset: CANDS[this.candOfLabel(l)].asset, presented_as: l,
      })),
      settings: {
        blind: this.blind, loudness_matched: false,
        stems: STEMS.filter(s => engine.stemOn(s)),
        loop: engine.loop ? { start_seconds: +engine.loop.start.toFixed(2), end_seconds: +engine.loop.end.toFixed(2), active: engine.loop.active } : null,
      },
      observations: this.observations.map(o => ({
        at_seconds: +o.at.toFixed(2), candidate: o.label, note: o.note,
      })),
      result: this.result,
    };
  },
};

/* ================================ shared bits =============================== */
const fmt = s => {
  const m = Math.floor(s / 60), sec = (s % 60).toFixed(1).padStart(4, "0");
  return `${m}:${sec}`;
};
function candName(label) {
  if (store.blind && !store.result) return "concealed";
  return CANDS[store.candOfLabel(label)].asset;
}
function activeLabel() {
  return typeof engine.active === "number" ? store.labelOf(engine.active) : "src";
}
function drawWave(canvas, candIdx, opts = {}) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const styles = getComputedStyle(document.documentElement);
  const colA = styles.getPropertyValue("--cand-a").trim();
  const colB = styles.getPropertyValue("--cand-b").trim();
  const line = styles.getPropertyValue("--line").trim();
  const muted = styles.getPropertyValue("--muted").trim();
  if (engine.loop) {
    g.fillStyle = line;
    g.globalAlpha = engine.loop.active === false ? 0.25 : 0.5;
    g.fillRect(engine.loop.start / DUR * w, 0, (engine.loop.end - engine.loop.start) / DUR * w, h);
    g.globalAlpha = 1;
  }
  if (engine.buffers) {
    let data, color;
    if (opts.buffer) {
      data = opts.buffer.getChannelData(0);
      color = opts.color === "A" ? colA : opts.color === "B" ? colB : muted;
    }
    else if (candIdx === "src") { data = engine.buffers.src.getChannelData(0); color = muted; }
    else {
      const ci = candIdx !== undefined ? candIdx : (typeof engine.active === "number" ? engine.active : engine.prevAB);
      data = engine.buffers.cands[ci].vocals.getChannelData(0);
      color = opts.neutral ? muted : (store.labelOf(ci) === "A" ? colA : colB);
      if (candIdx === undefined && engine.active === "src") { data = engine.buffers.src.getChannelData(0); color = muted; }
    }
    g.strokeStyle = color;
    g.beginPath();
    const step = Math.floor(data.length / w);
    for (let x = 0; x < w; x++) {
      let mx = 0;
      const base = x * step;
      for (let j = 0; j < step; j += 24) mx = Math.max(mx, Math.abs(data[base + j] || 0));
      const y = Math.min(h, mx * h * 1.6);
      g.moveTo(x + 0.5, h / 2 - y / 2 - 0.5);
      g.lineTo(x + 0.5, h / 2 + y / 2 + 0.5);
    }
    g.stroke();
  }
  const px = engine.position() / DUR * w;
  g.strokeStyle = styles.getPropertyValue("--text").trim();
  g.beginPath(); g.moveTo(px, 0); g.lineTo(px, h); g.stroke();
  if (opts.obsTicks) {
    for (const o of store.observations) {
      const ox = o.at / DUR * w;
      g.fillStyle = o.label === "A" ? colA : o.label === "B" ? colB : muted;
      g.beginPath(); g.moveTo(ox - 4, 0); g.lineTo(ox + 4, 0); g.lineTo(ox, 7); g.fill();
    }
  }
}

function attachWaveInteraction(canvas, useRegionAPI) {
  let downX = null, dragging = false;
  const toSec = e => {
    const r = canvas.getBoundingClientRect();
    return Math.max(0, Math.min(DUR, (e.clientX - r.left) / r.width * DUR));
  };
  canvas.addEventListener("pointerdown", e => { downX = toSec(e); dragging = false; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => {
    if (downX === null) return;
    const cur = toSec(e);
    if (Math.abs(cur - downX) > 0.25) {
      dragging = true;
      const st = Math.min(downX, cur), en = Math.max(downX, cur);
      // update engine state only — no emit: a re-render would replace the canvas mid-drag.
      // tick() redraws the loop shading each frame.
      engine.loop = { start: st, end: en, active: engine.loop ? engine.loop.active !== false : true };
    }
  });
  canvas.addEventListener("pointerup", e => {
    const cur = toSec(e);
    if (dragging) {
      const st = Math.min(downX, cur), en = Math.max(downX, cur);
      if (useRegionAPI) engine.setLoopRegion(st, en);
      else engine.setLoop({ start: st, end: en });
    } else engine.seek(cur);
    downX = null; dragging = false;
  });
}

function blindToggleHTML(id) {
  return `<label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer" class="label">
    <input type="checkbox" id="${id}" ${store.blind ? "checked" : ""}> blind</label>`;
}
function clearLoopBtn(id) {

}
function recordHTML() {

}
function savedBannerHTML() {
  if (!store.result) return "";
  const rev = ["A", "B"].map(l => `${l} = ${CANDS[store.candOfLabel(l)].asset}`).join(" · ");
  return `<div class="saved-banner">Result saved. ${store.blind ? "Identities revealed: " + rev + "." : ""} Record below is what <span class="tc">uncompose compare</span> would write to the project.</div>${recordHTML()}`;

  attachWaveInteraction(wave);
  const redraw = () => drawWave(wave, undefined, { neutral: false });
  redraw();
  root.querySelector("#c-play").onclick = () => engine.toggle();
  const cl = root.querySelector("#c-clearloop"); if (cl) cl.onclick = () => engine.setLoop(null);
  root.querySelector("#c-blind").onchange = e => store.setBlind(e.target.checked);
  const note = root.querySelector("#c-note");
  note.onkeydown = e => {
    if (e.key === "Enter") { store.addObs(note.value, activeLabel()); note.value = ""; }
    e.stopPropagation();
  };
  root.querySelector("#c-entries").onclick = e => {
    const t = e.target.dataset && e.target.dataset.t;
    if (t !== undefined) engine.seek(+t);
  };
  const saveC = p => store.saveResult({
    preferred: p, confidence: +(root.querySelector("#c-conf") || { value: 3 }).value,
    criterion: (root.querySelector("#c-crit") || { value: "" }).value || null,
  });
  if (!store.result) {
    root.querySelector("#c-pA").onclick = () => saveC("A");
    root.querySelector("#c-pB").onclick = () => saveC("B");
    root.querySelector("#c-pN").onclick = () => saveC(null);
    root.querySelector("#c-conf").oninput = e => root.querySelector("#c-confv").textContent = e.target.value;
  }
  const keys = e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (e.key === " ") { e.preventDefault(); engine.toggle(); }
    else if (e.key === "x") engine.switchTo(typeof engine.active === "number" ? 1 - engine.active : 0);
    else if (e.key === "i") { const p = engine.position(); engine.setLoop({ start: p, end: engine.loop ? Math.max(engine.loop.end, p + 0.5) : DUR }); }
    else if (e.key === "o") { const p = engine.position(); if (engine.loop) engine.setLoop({ start: Math.min(engine.loop.start, p - 0.5), end: p }); }
    else if (e.key === "u") engine.setLoop(null);
    else if (e.key === "n") { e.preventDefault(); note.focus(); }
  };
  document.addEventListener("keydown", keys);
  return {
    tick() {
      const el = root.querySelector("#c-clock");
      if (el) el.textContent = fmt(engine.position());
      const at = root.querySelector("#c-at");
      if (at && document.activeElement !== note) at.textContent = fmt(engine.position());
      redraw();
    },
    destroy() { document.removeEventListener("keydown", keys); },
  };
}

/* ========================= Variant D — Synthesis =========================== */
/* Ticket feedback merged: A's breathing room + stage grouping (play/loop/blind
   together), B's lanes + finish modal (select-not-close, save engraves but stays
   editable, preferred badge on the lane), C's ledger (click timestamp to seek,
   click text to edit, delete with ctrl-z / ctrl-shift-z), caret-anchored pins
   (above A / between for both / below B), source lane + stems matrix, help modal,
   the full keybinding set. */
function renderD(root) {
  const lab = activeLabel();          // "A" | "B" | "src"
  const pinsFor = where => {          // where: "A" | "both" | "B"
    return store.observations.map((o, i) => {
      const slot = o.label === null ? "both" : o.label;
      if (slot !== where) return "";
      const col = o.label === "A" ? "var(--cand-a)" : o.label === "B" ? "var(--cand-b)" : "var(--muted)";
      const glyph = where === "A" ? "▼" : where === "B" ? "▲" : "◆";
      return `<span class="mk" style="left:${o.at / DUR * 100}%;color:${col}" data-i="${i}" title="${o.note.replace(/"/g, "&quot;")}">${glyph}</span>`;
    }).join("");
  };
  const laneHTML = l => {
    const on = lab === l;
    const preferred = store.result && store.result.preferred === l;
    return `<div class="lane ${on ? "on" : ""} ${l === "A" ? "la" : "lb"}" data-lane="${l}" role="button" tabindex="0" aria-pressed="${on}">
      <div class="top">
        <span><span class="chip ${l === "A" ? "a" : "b"}">${l}</span> <span style="color:var(--muted);font-size:13px">${candName(l)}</span></span>
        <span style="display:flex;gap:10px;align-items:center">
          ${preferred ? `<span class="pref-badge">★ preferred · ${store.result.confidence}/5</span>` : ""}
          <span class="live">${on ? "● live" : "muted"}</span>
        </span>
      </div>
      <canvas class="wave" data-wave="${l}" style="height:56px"></canvas>
    </div>`;
  };
  const loop = engine.loop;
  const concealedLanes = store.blind && !store.result;  // feedback: blind hides the A/B lanes
  const dispCand = typeof engine.active === "number" ? engine.active : engine.prevAB;
  const dispCol = store.labelOf(dispCand) === "A" ? "var(--cand-a)" : "var(--cand-b)";
  root.innerHTML = `
  <div class="vD">
    <header>
      <h1>uncompose compare <span class="tc" style="color:var(--muted)">— synthesis</span></h1>
      <div style="display:flex;gap:10px;align-items:center">
        <button id="d-help" title="Help &amp; keybindings (?)">?</button>
        <button id="d-conclude">${store.result ? "Edit verdict…" : "Conclude…"}</button>
      </div>
    </header>

    <div class="lanes">
      ${concealedLanes ? `
      <div class="blindswitch">
        <button id="d-bsA" class="la ${lab === "A" ? "on" : ""}">A</button>
        <button id="d-bsB" class="lb ${lab === "B" ? "on" : ""}">B</button>
      </div>
      <span class="label">blind — lanes hidden · switch with the buttons or x</span>`
      : laneHTML("A") + laneHTML("B")}
      <div class="lane srclane ${lab === "src" ? "on lsrc" : ""}" data-lane="src" role="button" tabindex="0" aria-pressed="${lab === "src"}">
        <div class="top">
          <span><span class="chip">SRC</span> <span style="color:var(--muted);font-size:13px">${SOURCE.asset} — ${SOURCE.detail}</span></span>
          <span class="live">${lab === "src" ? "● live" : "muted"}</span>
        </div>
        <canvas class="wave" data-wave="src" style="height:34px"></canvas>
      </div>
    </div>

    <div class="stage">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span class="label">now auditioning — <span style="color:var(--text)">${lab === "src" ? SOURCE.asset + " (source)" : lab + " · " + candName(lab)}</span></span>
        <span class="tc" id="d-clock">${fmt(engine.position())} / ${fmt(DUR)}</span>
      </div>
      <div class="pins" id="d-pins-a">${pinsFor("A")}</div>
      <div class="waveWrap">
        <canvas class="wave" id="d-wave" style="height:88px"></canvas>
        <div class="pins overlay" id="d-pins-both">${pinsFor("both")}</div>
      </div>
      <div class="pins" id="d-pins-b">${pinsFor("B")}</div>
      <div class="transport">
        <button id="d-play" style="min-width:84px">${engine.playing ? "Stop" : "Play"}</button>
        <span class="loopbox ${loop && loop.active ? "active" : ""}">
          <span class="label">loop</span>
          ${loop ? `<span class="tc">${fmt(loop.start)}–${fmt(loop.end)}</span>
            <button id="d-looptoggle" title="Activate/deactivate loop (r)">${loop.active ? "on" : "off"}</button>
            <button id="d-loopclear" title="Clear loop (u)">✕</button>`
          : `<span style="color:var(--muted);font-size:12px">drag a region on any waveform</span>`}
        </span>
        ${blindToggleHTML("d-blind")}
        <label class="label" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer" title="What Stop does with the playhead">
          <input type="checkbox" id="d-stopmode" ${engine.stopMode === "return" ? "checked" : ""}> stop returns
        </label>
        <span class="label" style="margin-left:auto">click = seek · drag = loop · ? help</span>
      </div>
      <div style="margin-top:16px">
        <span class="label">stems — ${concealedLanes ? "concealed candidate" : (lab === "src" ? "last A/B lane" : lab)} · solo/mute synchronized across lanes · not applied to source</span>
        ${STEMS.map(s => `
        <div class="stemtrack ${engine.stemOn(s) ? "" : "dim"}">
          <span class="label">${s}</span>
          <button class="sm ${engine.stems.solo[s] ? "on-s" : ""}" data-solo="${s}" title="Solo ${s}">S</button>
          <button class="sm ${engine.stems.mute[s] ? "on-m" : ""}" data-mute="${s}" title="Mute ${s}">M</button>
          <canvas class="wave" data-stemwave="${s}" style="height:34px"></canvas>
        </div>`).join("")}
      </div>
    </div>

    <div class="ledger">
      <span class="label">session ledger — proto-01, ${store.blind ? "blind" : "identified"}</span>
      <div id="d-entries">
        ${store.observations.map((o, i) => `
        <div class="entry" id="led-${i}">
          <span class="tc t" data-t="${o.at}" title="Jump here">${fmt(o.at)}</span>
          <span class="chip ${o.label === "A" ? "a" : o.label === "B" ? "b" : ""}">${o.label || "AB"}</span>
          <span class="note" data-i="${i}" title="Click to edit">${o.note}</span>
          <button class="del" data-i="${i}" title="Delete (undo: ctrl-z)">✕</button>
        </div>`).join("") || `<div style="color:var(--muted);font-family:var(--serif);font-size:15px;margin-top:8px">No entries yet. Press <kbd>tab</kbd> to write; <kbd>enter</kbd> pins the live lane, <kbd>shift+enter</kbd> pins both.</div>`}
      </div>
      <div class="composer">
        <span class="tc" style="color:var(--muted)" id="d-at">${fmt(engine.position())}</span>
        <input type="text" id="d-note" placeholder="what do you hear? — enter pins ${lab === "src" ? "the last A/B lane" : lab}, shift+enter pins both">
      </div>
      ${store.result ? savedBannerHTML() : ""}
    </div>

    <dialog id="d-dialog">
      <h2 style="margin:0 0 4px;font-size:16px">${store.result ? "Edit verdict" : "Conclude comparison"}</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 14px">${store.observations.length} observation(s) · ${store.blind ? "blind" : "identified"} session${store.result ? " · saved verdicts stay editable" : ""}</p>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="verdict-row" id="d-prefbtns">
          <button data-p="A" class="la">Prefer A</button>
          <button data-p="B" class="lb">Prefer B</button>
          <button data-p="none" class="ln">No preference</button>
        </div>
        <label class="label">confidence <input type="range" id="d-conf" min="1" max="5" value="${store.result ? store.result.confidence : 3}"> <span class="tc" id="d-confv">${store.result ? store.result.confidence : 3}</span>/5</label>
        <input type="text" id="d-crit" placeholder="criterion (e.g. best isolation for transcription)" value="${store.result && store.result.criterion ? store.result.criterion.replace(/"/g, "&quot;") : ""}">
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="d-cancel">Cancel</button>
          <button id="d-save">Save verdict</button>
        </div>
      </div>
    </dialog>

    <dialog id="d-helpdlg">
      <h2 style="margin:0 0 10px;font-size:16px">Workbench help</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Click a lane to audition it. Drag on any waveform to set the loop region; click to seek. On the stage waveform, carets above belong to A, carets below to B, diamonds on the waveform to both — hover or click one to find its ledger entry. Each stem track has solo (S) and mute (M), synchronized across lanes; the tracks show the candidate being auditioned. Blind mode hides the A/B lanes (switch with the buttons or <kbd>x</kbd>) and shuffles which file is which. The verdict stays editable after saving.</p>
      <table>
        <tr><td><kbd>space</kbd></td><td>play / stop (see "stop returns" toggle)</td></tr>
        <tr><td><kbd>x</kbd></td><td>toggle A / B</td></tr>
        <tr><td><kbd>shift+x</kbd></td><td>toggle source against the last A/B lane</td></tr>
        <tr><td><kbd>←</kbd> / <kbd>→</kbd> or <kbd>-</kbd> / <kbd>=</kbd></td><td>step back / forward 2 s</td></tr>
        <tr><td><kbd>home</kbd> or <kbd>shift+←</kbd></td><td>rewind to beginning</td></tr>
        <tr><td><kbd>r</kbd></td><td>activate / deactivate loop (playhead before the region plays into it, then loops; deactivating mid-loop continues out)</td></tr>
        <tr><td><kbd>u</kbd></td><td>clear loop (playback continues)</td></tr>
        <tr><td><kbd>tab</kbd></td><td>focus the observation composer</td></tr>
        <tr><td><kbd>enter</kbd></td><td>pin observation to the live lane</td></tr>
        <tr><td><kbd>shift+enter</kbd></td><td>pin observation to both lanes</td></tr>
        <tr><td><kbd>ctrl+z</kbd> / <kbd>ctrl+shift+z</kbd></td><td>undo / redo ledger changes</td></tr>
      </table>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button id="d-helpclose">Close</button></div>
    </dialog>
  </div>`;

  /* --- waveforms --- */
  root.querySelectorAll("canvas.wave").forEach(w => attachWaveInteraction(w, true));
  const redraw = () => {
    const q = sel => root.querySelector(sel);
    if (q("#d-wave")) drawWave(q("#d-wave"));
    if (q('[data-wave="A"]')) drawWave(q('[data-wave="A"]'), store.candOfLabel("A"));
    if (q('[data-wave="B"]')) drawWave(q('[data-wave="B"]'), store.candOfLabel("B"));
    if (q('[data-wave="src"]')) drawWave(q('[data-wave="src"]'), "src");
    STEMS.forEach(s => {
      const c = q(`[data-stemwave="${s}"]`);
      // stem tracks display the candidate being auditioned (feedback: A/B toggle swaps them)
      if (c) drawWave(c, null, { buffer: engine.buffers.cands[dispCand][s], color: store.labelOf(dispCand) });
    });
  };
  redraw();

  /* --- lanes --- */
  root.querySelectorAll(".lane").forEach(el => {
    const act = () => {
      const l = el.dataset.lane;
      engine.switchTo(l === "src" ? "src" : store.candOfLabel(l));
    };
    el.addEventListener("click", e => { if (e.target.tagName !== "CANVAS" && !e.target.closest("button")) act(); });
    el.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); act(); } });
  });

  /* --- transport --- */
  root.querySelector("#d-play").onclick = () => engine.toggle();
  const lt = root.querySelector("#d-looptoggle"); if (lt) lt.onclick = () => engine.toggleLoopActive();
  const lc = root.querySelector("#d-loopclear"); if (lc) lc.onclick = () => engine.clearLoop();
  root.querySelector("#d-blind").onchange = e => store.setBlind(e.target.checked);
  root.querySelector("#d-stopmode").onchange = e => { engine.stopMode = e.target.checked ? "return" : "resume"; };
  root.querySelectorAll("[data-solo]").forEach(b => b.onclick = () => engine.toggleStemSolo(b.dataset.solo));
  root.querySelectorAll("[data-mute]").forEach(b => b.onclick = () => engine.toggleStemMute(b.dataset.mute));
  const bsA = root.querySelector("#d-bsA"), bsB = root.querySelector("#d-bsB");
  if (bsA) bsA.onclick = () => engine.switchTo(store.candOfLabel("A"));
  if (bsB) bsB.onclick = () => engine.switchTo(store.candOfLabel("B"));

  /* --- pins: hover/click highlights the ledger entry --- */
  const highlight = (i, scroll) => {
    root.querySelectorAll(".entry.hl").forEach(el => el.classList.remove("hl"));
    const el = root.querySelector(`#led-${i}`);
    if (el) { el.classList.add("hl"); if (scroll) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  };
  root.querySelectorAll(".pins").forEach(strip => {
    strip.addEventListener("mouseover", e => { if (e.target.dataset && e.target.dataset.i !== undefined) highlight(+e.target.dataset.i, false); });
    strip.addEventListener("click", e => { if (e.target.dataset && e.target.dataset.i !== undefined) highlight(+e.target.dataset.i, true); });
  });

  /* --- ledger --- */
  const entries = root.querySelector("#d-entries");
  entries.addEventListener("click", e => {
    const t = e.target.classList.contains("t") && e.target.dataset.t;
    if (t) { engine.seek(+t); return; }
    if (e.target.classList.contains("del")) { store.delObs(+e.target.dataset.i); return; }
    if (e.target.classList.contains("note")) {
      const i = +e.target.dataset.i;
      const span = e.target;
      const input = document.createElement("input");
      input.type = "text"; input.value = store.observations[i].note;
      span.textContent = ""; span.appendChild(input); input.focus(); input.select();
      const commit = () => store.editObs(i, input.value);
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", ev => {
        ev.stopPropagation();
        if (ev.key === "Enter") input.blur();
        if (ev.key === "Escape") { input.removeEventListener("blur", commit); store.emit(); }
      });
    }
  });

  /* --- composer --- */
  const note = root.querySelector("#d-note");
  const pinLabel = () => activeLabel() === "src" ? store.labelOf(engine.prevAB) : activeLabel();
  note.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { store.addObs(note.value, e.shiftKey ? null : pinLabel()); note.value = ""; }
    if (e.key === "Escape") note.blur();
  });

  /* --- verdict modal --- */
  const dlg = root.querySelector("#d-dialog");
  let pendingPref = store.result ? (store.result.preferred === null ? "none" : store.result.preferred) : null;
  const paintPref = () => root.querySelectorAll("#d-prefbtns button").forEach(b =>
    b.classList.toggle("sel", b.dataset.p === pendingPref));
  paintPref();
  root.querySelector("#d-conclude").onclick = () => { dlg.showModal(); paintPref(); };
  root.querySelector("#d-prefbtns").onclick = e => {
    const p = e.target.dataset && e.target.dataset.p;
    if (!p) return;
    pendingPref = p; paintPref();     // feedback B2a: select, don't close
  };
  root.querySelector("#d-conf").oninput = e => root.querySelector("#d-confv").textContent = e.target.value;
  root.querySelector("#d-cancel").onclick = () => dlg.close();
  root.querySelector("#d-save").onclick = () => {
    if (!pendingPref) return;
    store.saveResult({
      preferred: pendingPref === "none" ? null : pendingPref,
      confidence: +root.querySelector("#d-conf").value,
      criterion: root.querySelector("#d-crit").value || null,
    });
    dlg.close();
  };

  /* --- help modal --- */
  const help = root.querySelector("#d-helpdlg");
  root.querySelector("#d-help").onclick = () => help.showModal();
  root.querySelector("#d-helpclose").onclick = () => help.close();

  /* --- keybindings --- */
  const keys = e => {
    const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.ctrlKey && (e.key === "z" || e.key === "Z")) {
      e.preventDefault();
      if (e.shiftKey) store.redo(); else store.undo();
      return;
    }
    if (inField) return;
    if (e.key === "Tab") { e.preventDefault(); note.focus(); return; }
    if (e.key === " ") { e.preventDefault(); engine.toggle(); }
    else if (e.key === "x") engine.switchTo(typeof engine.active === "number" ? store.candOfLabel(activeLabel() === "A" ? "B" : "A") : engine.prevAB);
    else if (e.key === "X") engine.toggleSource();
    else if (e.key === "Home" || (e.key === "ArrowLeft" && e.shiftKey)) engine.seek(0);
    else if (e.key === "ArrowLeft" || e.key === "-") engine.step(-2);
    else if (e.key === "ArrowRight" || e.key === "=" || e.key === "+") engine.step(2);
    else if (e.key === "r") engine.toggleLoopActive();
    else if (e.key === "u") engine.clearLoop();
    else if (e.key === "?") help.showModal();
  };
  document.addEventListener("keydown", keys);

  return {
    tick() {
      const el = root.querySelector("#d-clock");
      if (el) el.textContent = `${fmt(engine.position())} / ${fmt(DUR)}`;
      const at = root.querySelector("#d-at");
      if (at && document.activeElement !== note) at.textContent = fmt(engine.position());
      redraw();
    },
    destroy() { document.removeEventListener("keydown", keys); },
  };
}

/* ============================ switcher + app loop =========================== */
const VARIANTS = [
  ["A", "Console — the switch is the instrument", renderA],
  ["B", "Lanes — candidates are places", renderB],
  ["C", "Ledger — the session is a notebook", renderC],
  ["D", "Synthesis — merged from feedback", renderD],
];
let current = null, mounted = null;

function variantFromURL() {
  const v = new URLSearchParams(location.search).get("variant") || "D";
  return VARIANTS.some(x => x[0] === v) ? v : "D";
}
function mount(v) {
  if (mounted && mounted.destroy) mounted.destroy();
  current = v;
  // variants A–C have no source lane; if audio is on the source, drop back to a candidate
  if (v !== "D" && engine.active === "src") engine.active = engine.prevAB;
  const def = VARIANTS.find(x => x[0] === v);
  document.getElementById("sw-name").textContent = `${def[0]} — ${def[1].split(" — ")[0]}`;
  mounted = def[2](document.getElementById("app"));
  const u = new URL(location); u.searchParams.set("variant", v);
  history.replaceState(null, "", u);
}
function cycle(dir) {
  const i = VARIANTS.findIndex(x => x[0] === current);
  mount(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0]);
}
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (current === "D") return;   // arrows are transport steps in variant D — use the pill
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

engine.onchange = () => mount(current);   // re-render on engine state change
store.listeners.push(() => mount(current));
engine.init();                            // synth the candidates up front so waveforms render
mount(variantFromURL());
setInterval(() => { if (mounted && mounted.tick) mounted.tick(); }, 66);
window.addEventListener("resize", () => mount(current));
</script>
