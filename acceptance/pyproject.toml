# The end-to-end acceptance test (M6, #99): the vertical slice driven through
# pip-installed wheels. Python rather than Rust because the seam under test is
# the installed artifact — a clean virtual environment holding all three
# published packages — and because the browser leg joins it here later.
#
# This package is never published; it exists so `uv run pytest` in this
# directory has the harness importable.

[project]
name = "uncompose-acceptance"
version = "0.1.0"
description = "End-to-end acceptance test: the Uncompose vertical slice driven through pip-installed wheels"
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncompose_acceptance"]
